name: GitHub Pages

on:
  push:
    branches:
      - develop
      - staging
      - trying
  pull_request:
  schedule:
    # Once per midnight. This allows me to publish future blog posts automatically.
    - cron: "* 0 * * *"

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Checkout theme
        uses: actions/checkout@v7
        with:
          repository: JensRantil/hugo-coder
          path: themes/hugo-coder
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/develop' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          publish_branch: master

